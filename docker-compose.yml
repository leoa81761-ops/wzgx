services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gonghao
      POSTGRES_PASSWORD: gonghao
      POSTGRES_DB: gonghao
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gonghao -d gonghao"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://gonghao:gonghao@db:5432/gonghao?sslmode=disable
      MASTER_KEY: ${MASTER_KEY:-dev-master-key-change-me}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
      WECHAT_MODE: ${WECHAT_MODE:-mock}
      WECHAT_API_BASE: ${WECHAT_API_BASE:-https://api.weixin.qq.com}
      LLM_MODE: ${LLM_MODE:-mock}
      PUBLIC_EGRESS_IP: ${PUBLIC_EGRESS_IP:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PUBLISH_DAILY_CAP: ${PUBLISH_DAILY_CAP:-20}
      PAY_SANDBOX: ${PAY_SANDBOX:-}
      WXPAY_MCH_ID: ${WXPAY_MCH_ID:-}
      WXPAY_APP_ID: ${WXPAY_APP_ID:-}
      WXPAY_MCH_SERIAL: ${WXPAY_MCH_SERIAL:-}
      WXPAY_API_V3_KEY: ${WXPAY_API_V3_KEY:-}
      WXPAY_PRIVATE_KEY: ${WXPAY_PRIVATE_KEY:-}
      WXPAY_PRIVATE_KEY_FILE: ${WXPAY_PRIVATE_KEY_FILE:-}
      WXPAY_PLATFORM_CERT: ${WXPAY_PLATFORM_CERT:-}
      WXPAY_PLATFORM_CERT_FILE: ${WXPAY_PLATFORM_CERT_FILE:-}
      WXPAY_NOTIFY_URL: ${WXPAY_NOTIFY_URL:-}
      WXPAY_API_BASE: ${WXPAY_API_BASE:-https://api.mch.weixin.qq.com}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PRIVATE_KEY_FILE: ${ALIPAY_PRIVATE_KEY_FILE:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_PUBLIC_KEY_FILE: ${ALIPAY_PUBLIC_KEY_FILE:-}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL:-}
      ALIPAY_GATEWAY: ${ALIPAY_GATEWAY:-https://openapi.alipay.com/gateway.do}
      PAY_PRICE_STANDARD_MONTH: ${PAY_PRICE_STANDARD_MONTH:-}
      PAY_PRICE_STANDARD_YEAR: ${PAY_PRICE_STANDARD_YEAR:-}
      PAY_PRICE_PREMIUM_MONTH: ${PAY_PRICE_PREMIUM_MONTH:-}
      PAY_PRICE_PREMIUM_YEAR: ${PAY_PRICE_PREMIUM_YEAR:-}
      PAY_PRICE_LIFETIME: ${PAY_PRICE_LIFETIME:-}
      SCHEDULER_ENABLED: "1"
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-60}
      STALE_TASK_SECONDS: ${STALE_TASK_SECONDS:-3600}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-1024}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-16}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-8}
      GOMAXPROCS: "4"
      GOMEMLIMIT: 3GiB
      WX_APP_ID: ${WX_APP_ID:-}
      WX_APP_SECRET: ${WX_APP_SECRET:-}
      LLM_PROTOCOL: ${LLM_PROTOCOL:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      RESEARCH_TIMEOUT_SECONDS: ${RESEARCH_TIMEOUT_SECONDS:-150}
      RESEARCH_BACKUP_MODEL: ${RESEARCH_BACKUP_MODEL:-grok-chat-fast}
      LLM_EXTRA_HEADERS: ${LLM_EXTRA_HEADERS:-}
      PROBE_DIRECTION: ${PROBE_DIRECTION:-职场成长}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
