services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gonghao
      POSTGRES_PASSWORD: gonghao
      POSTGRES_DB: gonghao
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gonghao -d gonghao"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://gonghao:gonghao@db:5432/gonghao
      MASTER_KEY: ${MASTER_KEY:-dev-master-key-change-me}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
      WECHAT_MODE: ${WECHAT_MODE:-mock}
      WECHAT_API_BASE: ${WECHAT_API_BASE:-https://api.weixin.qq.com}
      LLM_MODE: ${LLM_MODE:-mock}
      PUBLIC_EGRESS_IP: ${PUBLIC_EGRESS_IP:-}
      SCHEDULER_ENABLED: "1"
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
